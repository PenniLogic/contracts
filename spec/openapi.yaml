        status: {$ref: '#/components/schemas/TransactionStatus'}
        occurred_at: {$ref: '#/components/schemas/Instant'}
        booked_at: {$ref: '#/components/schemas/Instant'}
        value_date: {$ref: '#/components/schemas/LocalDate'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        entry_count: {type: integer, minimum: 2, maximum: 64}
        entries: {type: array, minItems: 2, maxItems: 64, items: {$ref: '#/components/schemas/LedgerEntry'}}
        source_event_id: {$ref: '#/components/schemas/SourceEventId'}
        description: {type: string, maxLength: 280}
        reverses: {$ref: '#/components/schemas/DedupRecordId'}
        replaces: {$ref: '#/components/schemas/DedupRecordId'}
        correction_id: {$ref: '#/components/schemas/ResourceId'}
        category_id:
          $ref: '#/components/schemas/ResourceId'
          description: Read-only single-category projection; never accepted by a transaction write.
      allOf:
        - if: {properties: {kind: {const: REVERSAL}}, required: [kind]}
          then: {required: [reverses, correction_id], not: {required: [replaces]}}
          else: {not: {required: [reverses]}}
        - if: {properties: {kind: {const: REPOST}}, required: [kind]}
          then: {required: [replaces, correction_id]}
          else: {not: {required: [replaces]}}
        - if: {properties: {kind: {enum: [OPENING_BALANCE, RECONCILIATION_ADJUSTMENT]}}, required: [kind]}
          then: {required: [value_date]}
      description: |
        A posted fact carries both effective and application-assigned posting instants. The
        server computes calendar boundaries from the profile time zone; the client never invents
        booked_at or recomputes authoritative balances. Entries, dates and correction links are immutable.
    TransactionPage:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [transactions, page]
      properties:
        transactions: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Transaction'}}
        page: {$ref: '#/components/schemas/CursorPage'}
    ReverseTransactionRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      properties:
        reason_note: {type: string, maxLength: 280}
      description: USER_CORRECTION reason is server-fixed; optional personal note never enters errors, logs or an idempotency store payload.
    CorrectTransactionRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [replacements]
      properties:
        replacements: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/PostTransactionRequest'}}
        reason_note: {type: string, maxLength: 280}
      description: All replacement facts and the exact reversal commit atomically; no partial or in-place correction.
    TransactionCorrection:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [correction_id, reversal, replacements]
      properties:
        correction_id: {$ref: '#/components/schemas/ResourceId'}
        reversal: {$ref: '#/components/schemas/Transaction'}
        replacements: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/Transaction'}}
      description: Server receipt of one atomic correction; every row shares the same correction_id.
    CategorisationViewMode:
      type: string
      enum: [CURRENT, AS_RECORDED]
    CategorisationView:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [mode, as_of]
      properties:
        mode: {$ref: '#/components/schemas/CategorisationViewMode'}
        as_of: {anyOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
      allOf:
        - if: {properties: {mode: {const: CURRENT}}, required: [mode]}
          then: {properties: {as_of: {type: 'null'}}}
          else: {properties: {as_of: {$ref: '#/components/schemas/Instant'}}}
      description: Exact ADR-016 mode/effective instant; CURRENT always emits explicit null and AS_RECORDED emits the server-used UTC instant.
    CategoryAssignmentSource:
      type: string
      enum: [USER, RULE, IMPORT, AI, SYSTEM]
      description: ADR-016 rank order five through one; source is server-selected, not an input or a confidence band.
    CategoryAssignmentReason:
      type: string
      enum: [USER_EDIT, USER_CONFIRMATION, RULE_APPLIED, IMPORT_COLUMN, AI_APPLIED, POSTING_DEFAULT, REVERSAL_MIRROR, REPOST_CARRY, DUPLICATE_CARRY, REFUND_LINK, RULE_ROLLBACK]
    CategoryProvenanceRef:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: ADR-016 opaque UUID referent selected by reason, not a public transaction alias, raw evidence or caller authority; verify exact same-owner referent server-side.
    CategoryAllocationLine:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [entry_id, position, category_id, system_key, nature, amount]
      properties:
        entry_id: {$ref: '#/components/schemas/ResourceId'}
        position: {type: integer, minimum: 0, maximum: 31}
        category_id: {anyOf: [{$ref: '#/components/schemas/ResourceId'}, {type: 'null'}]}
        system_key: {anyOf: [{$ref: '#/components/schemas/CategorySystemKey'}, {type: 'null'}]}
        nature: {$ref: '#/components/schemas/CategoryNature'}
        amount: {$ref: '#/components/schemas/Money'}
      allOf:
        - if: {properties: {category_id: {type: 'null'}}, required: [category_id]}
          then: {properties: {system_key: {type: 'null'}}}
      description: Nonzero raw ledger-sign allocation with currency inherited from its entry; null category/key are explicit uncategorised markers.
    CategoryExactLineInput:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [category_id, amount]
      properties:
        category_id: {anyOf: [{$ref: '#/components/schemas/ResourceId'}, {type: 'null'}]}
        amount: {$ref: '#/components/schemas/Money'}
    CategoryWeightedLineInput:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [category_id, weight]
      properties:
        category_id: {anyOf: [{$ref: '#/components/schemas/ResourceId'}, {type: 'null'}]}
        weight: {type: integer, minimum: 1, maximum: 1000000}
    CategoryEntryAssignmentInput:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [entry_id, mode]
      properties:
        entry_id: {$ref: '#/components/schemas/ResourceId'}
        mode: {type: string, enum: [exact, weighted]}
        exact_lines: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/CategoryExactLineInput'}}
        weighted_lines: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/CategoryWeightedLineInput'}}
      allOf:
        - if: {properties: {mode: {const: exact}}, required: [mode]}
          then: {required: [exact_lines], not: {required: [weighted_lines]}}
          else: {required: [weighted_lines], not: {required: [exact_lines]}}
      description: One form per entry; input array order is the stable remainder tie-breaker, not a client-calculated share.
    CategoryAssignmentRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [entries]
      properties:
        entries: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/CategoryEntryAssignmentInput'}}
      description: Whole assignment set for each own categorisable entry; no partial patch, source, confidence, seq or client posting authority.
    Categorisation:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [view, category_id, allocations, assignment_id, source, reason, assigned_at]
      properties:
        view: {$ref: '#/components/schemas/CategorisationView'}
        category_id: {anyOf: [{$ref: '#/components/schemas/ResourceId'}, {type: 'null'}]}
        allocations: {type: array, minItems: 1, maxItems: 2048, items: {$ref: '#/components/schemas/CategoryAllocationLine'}}
        assignment_id: {$ref: '#/components/schemas/ResourceId'}
        source: {$ref: '#/components/schemas/CategoryAssignmentSource'}
        reason: {$ref: '#/components/schemas/CategoryAssignmentReason'}
        provenance_ref: {$ref: '#/components/schemas/CategoryProvenanceRef'}
        assigned_at: {$ref: '#/components/schemas/Instant'}
      allOf:
        - if: {properties: {reason: {const: USER_EDIT}}, required: [reason]}
          then: {properties: {source: {const: USER}}, not: {required: [provenance_ref]}}
        - if: {properties: {reason: {const: USER_CONFIRMATION}}, required: [reason]}
          then: {properties: {source: {const: USER}}}
        - if: {properties: {reason: {const: POSTING_DEFAULT}}, required: [reason]}
          then: {properties: {source: {const: SYSTEM}}, not: {required: [provenance_ref]}}
        - if: {properties: {reason: {const: RULE_APPLIED}}, required: [reason]}
          then: {required: [provenance_ref], properties: {source: {const: RULE}}}
        - if: {properties: {reason: {const: IMPORT_COLUMN}}, required: [reason]}
          then: {required: [provenance_ref], properties: {source: {const: IMPORT}}}
        - if: {properties: {reason: {const: AI_APPLIED}}, required: [reason]}
          then: {required: [provenance_ref], properties: {source: {const: AI}}}
        - if: {properties: {reason: {enum: [REVERSAL_MIRROR, REFUND_LINK]}}, required: [reason]}
          then: {required: [provenance_ref], properties: {source: {const: SYSTEM}}}
        - if: {properties: {reason: {enum: [REPOST_CARRY, DUPLICATE_CARRY, RULE_ROLLBACK]}}, required: [reason]}
          then: {required: [provenance_ref]}
      description: |
        category_id is the read-only view projection, null for split/uncategorised/unexplained
        facts, never the stored current projection under AS_RECORDED. Allocations are immutable
        whole-set facts; every source/reason pair and sum/sign/position rule is server-validated.
        USER_EDIT and POSTING_DEFAULT omit provenance; USER_CONFIRMATION may name its clarification;
        each other reason requires its exact same-owner rule/import/inference/carried assignment
        UUID under ADR-016 section 4.2. A reference is not the underlying personal evidence.
    CategoryNature:
      type: string
      enum: [EXPENSE, INCOME]
    CategoryKind:
      type: string
      enum: [SYSTEM, USER]
    CategorySystemKey:
      type: string
      enum: ["food","food.groceries","food.eating_out","housing","housing.rent","housing.maintenance","utilities","utilities.electricity","utilities.water","utilities.cooking_gas","utilities.mobile_recharge","utilities.internet","transport","transport.fuel","transport.public_transport","transport.taxi_auto","transport.rail_travel","transport.air_travel","transport.vehicle_maintenance","transport.parking_tolls","household","household.supplies","household.appliances","household.domestic_help","shopping","shopping.clothing","shopping.footwear","shopping.electronics","health","health.medicines","health.care","education","education.fees","education.books_supplies","personal","personal.care","personal.fitness","leisure","leisure.entertainment","leisure.subscriptions","leisure.accommodation","giving","giving.gifts","giving.donations","insurance","taxes","debt","debt.interest","debt.fees","fees","fees.banking","fees.foreign_exchange","income","income.salary","income.self_employment","income.interest","income.pension","income.rent","income.gifts"]
      pattern: '^[a-z][a-z0-9_]{1,30}(\.[a-z][a-z0-9_]{1,30})?$'
      maxLength: 63
      description: ADR-016 stable accepted seed key, not a user-supplied category kind or a ledger account.
    CategoryIcon:
      type: string
      enum: ["debt","education","fees","food","giving","health","household","housing","income","insurance","leisure","personal","shopping","taxes","transport","utilities"]
      pattern: '^[a-z][a-z0-9_]{1,30}$'
      description: Exact icon ID derived from the accepted seed's Unicode-scalar registry, never caller artwork or a URL.
    CategoryColour:
      type: string
      enum: ["blue","brown","gray","green","orange","purple","red","teal"]
      pattern: '^[a-z][a-z0-9_]{1,30}$'
      description: Exact colour ID derived from the accepted seed's sRGB8 registry, never free-form CSS/hex or an arbitrary external reference.
    CreateCategoryRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [name, nature, icon, colour]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        nature: {$ref: '#/components/schemas/CategoryNature'}
        icon: {$ref: '#/components/schemas/CategoryIcon'}
        colour: {$ref: '#/components/schemas/CategoryColour'}
        parent_id: {$ref: '#/components/schemas/ResourceId'}
      description: USER category; same-owner root parent and one-child-level rule are validated server-side.
    UpdateCategoryRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        is_archived: {type: boolean}
        icon: {$ref: '#/components/schemas/CategoryIcon'}
        colour: {$ref: '#/components/schemas/CategoryColour'}
      anyOf: [{required: [name]}, {required: [is_archived]}, {required: [icon]}, {required: [colour]}]
    Category:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [category_id, kind, nature, icon, colour, is_archived, created_at]
      properties:
        category_id: {$ref: '#/components/schemas/ResourceId'}
        kind: {$ref: '#/components/schemas/CategoryKind'}
        nature: {$ref: '#/components/schemas/CategoryNature'}
        icon: {$ref: '#/components/schemas/CategoryIcon'}
        colour: {$ref: '#/components/schemas/CategoryColour'}
        system_key: {$ref: '#/components/schemas/CategorySystemKey'}
        name: {type: string, minLength: 1, maxLength: 120}
        parent_id: {$ref: '#/components/schemas/ResourceId'}
        is_archived: {type: boolean}
        created_at: {$ref: '#/components/schemas/Instant'}
        active_redirect_id: {$ref: '#/components/schemas/ResourceId'}
      allOf:
        - if: {properties: {kind: {const: SYSTEM}}, required: [kind]}
          then: {required: [system_key]}
          else: {required: [name], not: {required: [system_key]}}
      description: |
        Owner reporting label; no currency, balance or account. Omitted parent means root, omitted
        SYSTEM name means the client renders the accepted seed label. Personal names remain protected.
    CategoryPage:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [categories, page]
      properties:
        categories: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Category'}}
        page: {$ref: '#/components/schemas/CursorPage'}
    RedirectCategoryRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [target_category_id]
      properties:
        target_category_id: {$ref: '#/components/schemas/ResourceId'}
    CategoryRedirect:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [redirect_id, source_category_id, target_category_id, created_at]
      properties:
        redirect_id: {$ref: '#/components/schemas/ResourceId'}
        source_category_id: {$ref: '#/components/schemas/ResourceId'}
        target_category_id: {$ref: '#/components/schemas/ResourceId'}
        created_at: {$ref: '#/components/schemas/Instant'}
        retracted_at: {$ref: '#/components/schemas/Instant'}
      description: Immutable same-owner redirect with optional one-time retraction, never hard deletion or reactivation.
  parameters:
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Opaque enrollment handle; verify ceremony and proving-key binding before account effects.
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Exact own credential bound into the step-up request.
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Own session reference, not a token or refresh-family identifier.
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Exact own device; possession is not authorization.
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Exact own channel handle, never its email/phone value.
    RecoveryId:
      name: recoveryId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Opaque flow handle; no account/status/window is disclosed before proof.
    RecoveryProof:
      name: Recovery-Proof
      in: header
      required: true
      schema: {$ref: '#/components/schemas/AuthOpaqueValue'}
      description: Proven own-flow/key-bound capability, never a substitute for DPoP or an arbitrary session owner claim.
    CoreApiVersion:
      name: API-Version
      in: header
      schema: {type: string, enum: [v1]}
      description: |
        Explicit major API selection; omission selects the configured /v1 route. Unknown/retired
        versions fail as validation_rejected, field request, reason not_available. Never silently
        route a write to another version. This is separate from the contract's semantic version.
    CoreCursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+$'}
      description: Opaque next cursor, bound to principal/operation/filters/sort/snapshot; expired or changed scope fails.
    CorePageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: Applied page limit; no zero, negative, floating-point or oversized page.
    CoreCreatedSort:
      name: sort
      in: query
      schema: {type: string, enum: ['created_at.asc,id.asc', 'created_at.desc,id.desc']}
      description: Closed stable order with unique-id tie breaker; no unstable or arbitrary SQL expression.
    TransactionSort:
      name: sort
      in: query
      schema: {type: string, enum: ['occurred_at.desc,transaction_id.desc', 'occurred_at.asc,transaction_id.asc']}
      description: Stable effective-instant order and public-record tie breaker, fixed for the cursor lifetime.
    ArchivedFilter:
      name: is_archived
      in: query
      schema: {type: boolean}
      description: Only a canonical boolean selector; unknown/repeated query parameters are refused.
    AccountTypeFilter:
      name: type
      in: query
      schema: {$ref: '#/components/schemas/AccountType'}
      description: Own account-type filter; never expands visibility.
    TransactionAccountFilter:
      name: account_id
      in: query
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Own account only; foreign and unknown scope receive the same safe refusal.
    TransactionCategoryFilter:
      name: category_id
      in: query
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Owner category filter resolved under ADR-016's current redirect view; not a grant.
    CategoryNatureFilter:
      name: nature
      in: query
      schema: {$ref: '#/components/schemas/CategoryNature'}
      description: Single-nature reporting category filter.
    CategoryParentFilter:
      name: parent_id
      in: query
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Own root parent only; hierarchy depth is bounded by ADR-016.
    OccurredFrom:
      name: occurred_from
      in: query
      schema: {$ref: '#/components/schemas/Instant'}
      description: Inclusive UTC effective-instant boundary; reject an empty/reversed interval.
    OccurredBefore:
      name: occurred_before
      in: query
      schema: {$ref: '#/components/schemas/Instant'}
      description: Exclusive UTC effective-instant boundary, strictly after occurred_from when both are present.
    CategorisationMode:
      name: view
      in: query
      schema: {$ref: '#/components/schemas/CategorisationViewMode'}
      description: CURRENT by omission or AS_RECORDED explicitly; no stored server preference is mutated by a read.
    CategorisationAsOf:
      name: as_of
      in: query
      schema: {$ref: '#/components/schemas/Instant'}
      description: AS_RECORDED effective bound; server supplies a default and clamps a future instant to request time, echoing it. Invalid with CURRENT.
    AccountId:
      name: accountId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Own financial account, never a caller-supplied owner claim.
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DedupRecordId'}
      description: The SAME public alias used by DedupOutcome and DuplicateOverride, never an internal fingerprint.
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Own category; possession is not authority.
    CategoryRedirectId:
      name: redirectId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceId'}
      description: Own redirect fact for this exact source category.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Client-generated lowercase UUID version 4, one per intended effect, persisted before the first send and reused unchanged on every retry (ADR-015 §4).
    DPoPProof:
      name: DPoP
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/DPoPProofValue'
      description: Fresh proof per physical send; the token and proof are not persisted in a generated default.
    StepUpToken:
      name: Step-Up-Token
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/StepUpTokenValue'
      description: Single-use operation/target/body-bound grant using step-up-request@1; not an authorization substitute.
    CustomDestinationId:
      name: destinationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CustomDestinationId'
      description: The authenticated owner's destination; reject wrong-owner/unknown identifiers without disclosure.
    CustomDestinationListLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Maximum number of the owner's registrations returned on this page.
    CustomDestinationListCursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 2048 }
      description: Opaque cursor issued for this owner; never accepts another owner's listing scope.
    DuplicateOverride:
      name: Duplicate-Override
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/DedupRecordId'
      description: Current matched surviving-record identifier from DedupOutcome. Explicit different-fact decision, never consent or an ownership bypass; retain the same key/bytes. Unknown/foreign IDs receive identical 400 validation_rejected with no effect. A changed/additional match returns DuplicateSuspected again.
  headers:
    CoreNoStore:
      required: true
      schema: {type: string, const: no-store}
      description: Private profile, credentials, tokens and proven recovery state must not be cached.
    CoreContractVersion:
      description: Semantic version of the source that produced the response, separate from the selected major API-Version.
      schema: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
    CoreDeprecation:
      description: |
        RFC9745 structured date (@ followed by epoch seconds) at which a deprecated interface
        was announced. A deprecated operation requires this header on each response. It is not
        an access/session expiry, an instant JSON codec or authorization.
      schema: {type: string, pattern: '^@[0-9]{1,12}$'}
    CoreSunset:
      description: |
        RFC8594 Sunset HTTP-date, at least P90D after the deprecation notice; server calendar/
        clock validation is required. A missing or malformed notice never permits retirement.
        No operation in this source is retired or deprecated.
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), [0-9]{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT$'
    IdempotentReplayed:
      schema: { type: boolean }
      description: Present and true when the response was served from the idempotency store.
    DPoPNonce:
      schema:
        type: string
        minLength: 1
      description: Fresh server challenge nonce to bind into the next newly signed proof, not a required request header.
    DPoPAuthenticate:
      schema:
        type: string
        pattern: '^DPoP(?: [^\r\n]+)?$'
      required: true
      description: |
        RFC 9449 challenge, never the Bearer scheme. A nonce challenge is exactly
        DPoP error="use_dpop_nonce" and requires a fresh DPoP-Nonce in the same response.
        use_dpop_nonce is protocol metadata, not another ProblemCode.
    CustomDestinationNoStore:
      required: true
      schema:
        type: string
        const: no-store
      description: Personal destination settings and errors must not be cached.
    RetryAfter:
      schema:
        type: integer
        minimum: 1
        maximum: 86400
      description: |
        Decimal delta seconds, required when retry_after_seconds is present and equal to that
        body member. A delay never authorizes an automatic retry, changed key/body, expired
        retry horizon, reused DPoP proof or weaker authentication.
    ImportCommitReplayed:
      schema: {type: boolean}
      description: Present and true when this preview's original commit receipt was returned with no additional fact, including under a new request key. Distinct from Idempotent-Replayed; neither changes the immutable receipt body.
  requestBodies:
    CustomDestinationLifecycle:
      required: true
      description: Exact current revision; identity comes from verified session authority and destinationId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomDestinationLifecycleRequest'
  responses:
    AuthNoContent:
      description: Completed own authentication lifecycle effect; no credential or private receipt body.
      headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
    AuthTokens:
      description: |
        DPoP-bound session token response. Web sets only the HttpOnly/Secure/SameSite=Strict refresh
        cookie and omits refresh_token from JSON; Android receives it in this no-store envelope.
      headers:
        Cache-Control: {$ref: '#/components/headers/CoreNoStore'}
        DPoP-Nonce: {$ref: '#/components/headers/DPoPNonce'}
      content: {application/json: {schema: {$ref: '#/components/schemas/AuthTokenSet'}}}
    CoreDPoPChallenge:
      description: |
        Shared authentication-required or ended-session 401. For proof skew/replay, return the
        exact DPoP nonce challenge and fresh DPoP-Nonce; every resend signs a fresh proof.
      x-response-status: 401
      x-dpop-nonce-challenge: {authenticate: 'DPoP error="use_dpop_nonce"', required-header: DPoP-Nonce}
      headers:
        DPoP-Nonce: {$ref: '#/components/headers/DPoPNonce'}
        WWW-Authenticate: {$ref: '#/components/headers/DPoPAuthenticate'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AuthenticationChallengeProblemDetail'
    CoreProblem:
      description: |
        Shared safe RFC 9457 service/authentication families; no endpoint-local error catalogue.
        Match HTTP status to the typed code, honour challenge/delay headers, never echo raw input,
        financial values or hidden-resource identifiers. Proof/authorization and runtime validation
        are server duties, not claims made by generated schemas.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApplicationProblemDetail'
    CoreTransactionCreated:
      description: Immutable committed ledger fact; idempotent replay returns exactly the original receipt, not current state.
      headers:
        Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Transaction'}
    ServiceProblem:
      description: Published safe problem detail; the HTTP status equals the catalogue status for its typed code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ServiceProblemDetail'
    DuplicateSuspected:
      description: 202 content decision, no financial effect or created record, no queue acknowledgement and not an error. Committed-resource responses must use another status. The service re-screens on every override.
      x-response-status: 202
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/DedupOutcome'
              - properties: {outcome: {const: duplicate_suspected}}
    CustomDestinationDPoPChallenge:
      description: |
        Authentication failure. For a nonce challenge return WWW-Authenticate with DPoP
        error="use_dpop_nonce" and fresh DPoP-Nonce; the caller must sign a fresh proof.
        The shared authentication-only 401 variant is outside the service-error state projection.
      x-response-status: 401
      x-required-response-headers: [WWW-Authenticate, Cache-Control]
      x-dpop-nonce-challenge:
        authenticate: 'DPoP error="use_dpop_nonce"'
        required-header: DPoP-Nonce
      headers:
        DPoP-Nonce:
          $ref: '#/components/headers/DPoPNonce'
        WWW-Authenticate:
          $ref: '#/components/headers/DPoPAuthenticate'
        Cache-Control:
          $ref: '#/components/headers/CustomDestinationNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AuthenticationRequiredProblemDetail'
    CustomDestinationStateResult:
      description: Current authoritative owner registration after the lifecycle operation.
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
        Cache-Control:
          $ref: '#/components/headers/CustomDestinationNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomDestination'
    CustomDestinationProblem:
      description: |
        Shared RFC 9457 problem details only, with no host, model name, address, key or upstream
        exception. The one shared closed union distinguishes authentication, service-egress and
        ordinary validation/service problems before generated conversion. Match the body status
        to the HTTP status and honour required challenge/delay headers; do not automatically retry.
      x-required-response-headers: [Cache-Control]
      x-response-header-bindings:
        retry_after_seconds: Retry-After
      headers:
        Cache-Control:
          $ref: '#/components/headers/CustomDestinationNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/OperationProblemDetail'
  securitySchemes:
    BrowserRefreshCookie:
      type: apiKey
      in: cookie
      name: pennilogic_refresh
      description: |
        Browser-carried HttpOnly/Secure/SameSite=Strict refresh cookie. It is a security requirement,
        never a script-readable operation argument. Browser fetch uses credentials include; actual
        cookie, origin, CSRF, family and device-proof verification remain server/browser duties.
    DPoPBootstrap:
      type: apiKey
      in: header
      name: DPoP
      x-pennilogic-per-call-proof: true
      description: |
        Explicit pre-access-token authentication-ceremony/device-proof requirement, not anonymous
        default access, Bearer or session authority. Every operation still requires the per-send
        DPoPProof parameter. Use a separate bootstrap client with this API-key slot UNSET; never
        configure or persist a reusable global proof. Verify htm/htu/iat/jti/key and the operation's
        channel/ceremony/recovery/refresh instrument server-side; ath is required only once an
        access token is used on a resource request. This raw-header source mapping is not a signer,
        preauthentication verifier, nonce engine or qualified client adoption.
    DPoP:
      type: apiKey
      in: header
      name: Authorization
      description: |
        RFC 9449 DPoP-bound access-token authentication, NOT API-key or Bearer authentication.
        openapi-generator 7.25.0 has no HTTP-DPoP template: apiKey is only a raw-header codegen
        mapping. Supply the COMPLETE "DPoP <at+jwt>" value and leave apiKeyPrefix unset.
        Send the separate required fresh DPoP proof. Generated transport tests verify no Bearer
        or doubled prefix; they do not verify signatures, nonce handling or live session authority.
