      required: [proof, name]
      properties:
        proof: {$ref: '#/components/schemas/AuthOpaqueValue'}
        name: {type: string, minLength: 1, maxLength: 80}
      description: Bound one-shot recovery instrument and user label only; no target device, caller trust or session-owner override.
    AuthRegistrationGrant:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [registration_grant, expires_at]
      properties:
        registration_grant: {$ref: '#/components/schemas/AuthOpaqueValue'}
        expires_at: {$ref: '#/components/schemas/Instant'}
    AuthDeviceChallenge:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [challenge_id, challenge, expires_at]
      properties:
        challenge_id: {$ref: '#/components/schemas/ResourceId'}
        challenge: {$ref: '#/components/schemas/AuthChallengeValue'}
        expires_at: {$ref: '#/components/schemas/Instant'}
    AuthDeviceRegistrationRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [challenge_id, device]
      properties:
        challenge_id: {$ref: '#/components/schemas/ResourceId'}
        device: {$ref: '#/components/schemas/AuthDeviceInput'}
    AuthRecoveryCompletion:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [tokens, recovery]
      properties:
        tokens: {$ref: '#/components/schemas/AuthTokenSet'}
        recovery: {$ref: '#/components/schemas/AuthRecoveryProgress'}
      allOf:
        - properties:
            tokens: {properties: {trust: {const: recovering}}}
            recovery: {properties: {state: {const: restricted_after_recovery}}}
    AuthStepUpIntentTarget:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      properties:
        credentialId: {$ref: '#/components/schemas/ResourceId'}
        deviceId: {$ref: '#/components/schemas/ResourceId'}
        channelId: {$ref: '#/components/schemas/ResourceId'}
        destinationId: {$ref: '#/components/schemas/CustomDestinationId'}
      description: Closed exact path-parameter object; AuthStepUpIntent requires only the registered operation's complete target.
    AuthStepUpIntentBody:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        type: {type: string, const: email}
        value: {$ref: '#/components/schemas/AuthEmailAddress'}
        code: {type: string, pattern: '^[0-9]{6}$'}
        link_token: {$ref: '#/components/schemas/AuthOpaqueValue'}
        host: {$ref: '#/components/schemas/CustomDestinationHost'}
        pathPrefix: {$ref: '#/components/schemas/CustomDestinationPathPrefix'}
        credentialHeader: {$ref: '#/components/schemas/CredentialHeader'}
        providerKeyRef: {$ref: '#/components/schemas/CustomDestinationProviderKeyRef'}
        models: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {$ref: '#/components/schemas/CustomDestinationModelName'}}
        version: {$ref: '#/components/schemas/CustomDestinationVersion'}
      description: Strict named converter for the unchanged wire object; AuthStepUpIntent selects the exact registered endpoint schema without inserting defaults.
    AuthStepUpIntent:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [version, operation, method, target, body]
      properties:
        version: {type: string, const: 'step-up-request@1'}
        operation:
          type: string
          enum: [addCredential, renameCredential, removeCredential, removeDevice, addChannel, verifyChannel, removeChannel, regenerateRecoveryCodes, registerCustomDestination, activateCustomDestination]
        method: {type: string, enum: [POST, PATCH, DELETE]}
        target: {$ref: '#/components/schemas/AuthStepUpIntentTarget'}
        body: {$ref: '#/components/schemas/AuthStepUpIntentBody'}
      allOf:
        - if: {properties: {operation: {const: addCredential}}, required: [operation]}
          then: {properties: {method: {const: POST}, body: {$ref: '#/components/schemas/AuthCredentialNameRequest'}}}
        - if: {properties: {operation: {const: renameCredential}}, required: [operation]}
          then:
            properties:
              method: {const: PATCH}
              target: {required: [credentialId], not: {anyOf: [{required: [deviceId]}, {required: [channelId]}, {required: [destinationId]}]}}
              body: {$ref: '#/components/schemas/AuthCredentialNameRequest'}
        - if: {properties: {operation: {enum: [removeCredential, removeDevice, removeChannel]}}, required: [operation]}
          then: {properties: {method: {const: DELETE}, body: {not: {anyOf: [{required: [name]}, {required: [type]}, {required: [value]}, {required: [code]}, {required: [link_token]}, {required: [host]}, {required: [pathPrefix]}, {required: [credentialHeader]}, {required: [providerKeyRef]}, {required: [models]}, {required: [version]}]}}}}
        - if: {properties: {operation: {const: removeCredential}}, required: [operation]}
          then: {properties: {target: {required: [credentialId]}}}
        - if: {properties: {operation: {const: removeDevice}}, required: [operation]}
          then: {properties: {target: {required: [deviceId]}}}
        - if: {properties: {operation: {const: removeChannel}}, required: [operation]}
          then: {properties: {target: {required: [channelId]}}}
        - if: {properties: {operation: {const: addChannel}}, required: [operation]}
          then: {properties: {method: {const: POST}, body: {$ref: '#/components/schemas/AuthChannelInput'}}}
        - if: {properties: {operation: {const: verifyChannel}}, required: [operation]}
          then: {properties: {method: {const: POST}, target: {required: [channelId]}, body: {$ref: '#/components/schemas/AuthChannelProofRequest'}}}
        - if: {properties: {operation: {const: registerCustomDestination}}, required: [operation]}
          then: {properties: {method: {const: POST}, body: {$ref: '#/components/schemas/CustomDestinationRegistrationRequest'}, target: {not: {anyOf: [{required: [credentialId]}, {required: [deviceId]}, {required: [channelId]}, {required: [destinationId]}]}}}}
        - if: {properties: {operation: {const: activateCustomDestination}}, required: [operation]}
          then: {properties: {method: {const: POST}, target: {required: [destinationId]}, body: {$ref: '#/components/schemas/CustomDestinationLifecycleRequest'}}}
        - if: {properties: {operation: {const: regenerateRecoveryCodes}}, required: [operation]}
          then: {properties: {method: {const: POST}, body: {not: {anyOf: [{required: [name]}, {required: [type]}, {required: [value]}, {required: [code]}, {required: [link_token]}, {required: [host]}, {required: [pathPrefix]}, {required: [credentialHeader]}, {required: [providerKeyRef]}, {required: [models]}, {required: [version]}]}}}}
        - if: {properties: {operation: {not: {enum: [renameCredential, removeCredential]}}}, required: [operation]}
          then: {properties: {target: {not: {required: [credentialId]}}}}
        - if: {properties: {operation: {not: {const: removeDevice}}}, required: [operation]}
          then: {properties: {target: {not: {required: [deviceId]}}}}
        - if: {properties: {operation: {not: {enum: [verifyChannel, removeChannel]}}}, required: [operation]}
          then: {properties: {target: {not: {required: [channelId]}}}}
        - if: {properties: {operation: {not: {const: activateCustomDestination}}}, required: [operation]}
          then: {properties: {target: {not: {required: [destinationId]}}}}
      description: |
        Exact Root-selected step-up-request@1 envelope, not caller authority. The issuer validates
        each registered operation's complete path/body schema, absence of unknown query selectors,
        duplicate JSON names and non-IJSON values before JCS hashing. Preserve omissions and model
        ordering; do not insert defaults or normalize inputs. Other contract groups must register
        their exact operations additively before this issuer may grant them. No raw intent/rq logging.
    AuthStepUpResultRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [ceremony_id, response]
      properties:
        ceremony_id: {$ref: '#/components/schemas/ResourceId'}
        response: {$ref: '#/components/schemas/AuthAssertionResultRequest'}
    AuthStepUpGrant:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [step_up_token, expires_at]
      properties:
        step_up_token: {$ref: '#/components/schemas/StepUpTokenValue'}
        expires_at: {$ref: '#/components/schemas/Instant'}
      description: Opaque single-use sid/jkt/op/rq-bound grant; UV freshness at most 300 seconds, verified expiry and atomic consumption.
    AuthRecoveryRoute:
      type: string
      enum: [recovery_code, channel_reverification]
      description: Exactly the two accepted ADR-019 recovery routes; no password, SMS-login or zero-proof fallback.
    AuthRevocationReason:
      type: string
      enum: [reuse_detected, binding_mismatch, signout, signout_all, absolute_expiry, recovery, not_me, admin]
      description: Accepted session-family reason class, never token or account internals.
    SessionRevokedProblemDetail:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [type, title, status, detail, code, correlation_id, revocation_reason]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string, maxLength: 200}
        status: {type: integer, const: 401}
        detail: {type: string, maxLength: 2000}
        code: {$ref: '#/components/schemas/ProblemCode', const: session_revoked}
        correlation_id: {$ref: '#/components/schemas/PublicCorrelationId'}
        instance: {$ref: '#/components/schemas/PublicProblemInstance'}
        revocation_reason: {$ref: '#/components/schemas/AuthRevocationReason'}
      allOf:
        - $ref: '#/components/schemas/AuthenticationContextProblemDetail'
      description: Shared authentication-only ended-session variant; never an account-existence or token disclosure.
    ResourceId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Server-issued lowercase UUIDv7 for an own resource; possession never confers authority.
    SourceEventId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Random device event identity persisted before enqueue, never derived from raw content or a dedupe fingerprint.
    CursorPage:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [page_size, has_more]
      properties:
        page_size: {type: integer, minimum: 1, maximum: 100}
        has_more: {type: boolean}
        cursor:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^[A-Za-z0-9_-]+$'
      allOf:
        - if: {properties: {has_more: {const: true}}, required: [has_more]}
          then: {required: [cursor]}
          else: {not: {required: [cursor]}}
      description: |
        Shared bounded cursor envelope. cursor is the next-page token and exists iff has_more.
        The server binds it to verified principal, operation, full filter/sort set and a stable
        snapshot expiring after PT24H. page_size is the applied limit, not a total/hidden-row count.
    AccountType:
      type: string
      enum: [ASSET, LIABILITY, INCOME, EXPENSE, EQUITY, CLEARING]
      description: ADR-017 account types; only ASSET and LIABILITY are client-creatable.
    AccountSystemRole:
      type: string
      enum: [OPENING_BALANCE, RECONCILIATION, FX_CLEARING, FX_FEE, INCOME, EXPENSE]
      description: Server-only ADR-016/017 role; at most one account per owner/role/currency.
    CreateAccountRequest:
