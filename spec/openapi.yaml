        currency: {$ref: '#/components/schemas/CurrencyCode'}
        name: {type: string, minLength: 1, maxLength: 120}
        is_archived: {type: boolean}
        created_at: {$ref: '#/components/schemas/Instant'}
        system_role: {$ref: '#/components/schemas/AccountSystemRole'}
      description: Financial account settings, not a stored/writable balance or category.
    AccountPage:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [accounts, page]
      properties:
        accounts: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Account'}}
        page: {$ref: '#/components/schemas/CursorPage'}
