      properties:
        recovery_id: {$ref: '#/components/schemas/ResourceId'}
        state: {type: string, const: unproven}
      description: Identical opaque synthetic/provenance-free handle and status whether the channel/account exists or a limiter drops it.
    AuthRecoveryVerifyRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      properties:
        recovery_code: {type: string, minLength: 10, maxLength: 64}
        channel_proof: {$ref: '#/components/schemas/AuthChannelProofRequest'}
      oneOf: [{required: [recovery_code], not: {required: [channel_proof]}}, {required: [channel_proof], not: {required: [recovery_code]}}]
      description: Normalize Crockford input before one capped Argon2id slot check; unknown channels/codes remain identical before proof.
    AuthRecoveryState:
      type: string
      enum: [unproven, notification_pending, cooling_off, pending_elsewhere, cancelled, completed, restricted_after_recovery, reversed]
    AuthRecoveryProgress:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [recovery_id, state]
      properties:
        recovery_id: {$ref: '#/components/schemas/ResourceId'}
        state: {$ref: '#/components/schemas/AuthRecoveryState'}
        recovery_proof: {$ref: '#/components/schemas/AuthOpaqueValue'}
        window_ends_at: {anyOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
        retry_after_seconds: {type: integer, minimum: 1, maximum: 86400}
        restricted_until: {$ref: '#/components/schemas/Instant'}
        not_me_until: {$ref: '#/components/schemas/Instant'}
        pending_route: {$ref: '#/components/schemas/AuthRecoveryRoute'}
        action: {type: string, const: cancel_and_restart}
      allOf:
        - if: {properties: {state: {const: unproven}}, required: [state]}
          then: {not: {anyOf: [{required: [recovery_proof]}, {required: [window_ends_at]}, {required: [retry_after_seconds]}, {required: [restricted_until]}, {required: [not_me_until]}, {required: [pending_route]}, {required: [action]}]}}
        - if: {properties: {state: {enum: [notification_pending, cooling_off, pending_elsewhere, restricted_after_recovery]}}, required: [state]}
          then: {required: [recovery_proof]}
        - if: {properties: {state: {const: notification_pending}}, required: [state]}
          then: {required: [window_ends_at, retry_after_seconds], properties: {window_ends_at: {type: 'null'}}}
          else: {not: {required: [retry_after_seconds]}}
        - if: {properties: {state: {enum: [cooling_off, pending_elsewhere]}}, required: [state]}
          then: {required: [window_ends_at], properties: {window_ends_at: {$ref: '#/components/schemas/Instant'}}}
        - if: {properties: {state: {const: pending_elsewhere}}, required: [state]}
          then: {required: [pending_route, action]}
          else: {not: {anyOf: [{required: [pending_route]}, {required: [action]}]}}
        - if: {properties: {state: {const: restricted_after_recovery}}, required: [state]}
          then: {required: [restricted_until, not_me_until]}
          else: {not: {anyOf: [{required: [restricted_until]}, {required: [not_me_until]}]}}
      description: |
        Window/lock/context is returned only after account proof under the bound device.
        notification_pending MUST preserve explicit null (no window started). One pending request
        per account; same credential/device attaches, another prover explicitly cancel-and-restarts.
        Proven active flows return the bounded recovery instrument needed for subsequent actions;
        completion issues the restricted-period instrument, never a reused single-use action token.
        An unproven receipt cannot contain any account/window/proof context.
        All calendar/window instants are server-owned; no timer alone grants access.
    AuthRecoveryActionRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      required: [proof]
      properties:
        proof: {$ref: '#/components/schemas/AuthOpaqueValue'}
      description: Bound recovery or single-use notification instrument; server verifies route, owner, device and permitted action.
    AuthRecoveryCredentialRequest:
      type: object
