        currency: {$ref: '#/components/schemas/CurrencyCode', type: string, enum: [INR]}
        name: {type: string, minLength: 1, maxLength: 120}
      description: No initial balance, system role, owner, raw message or full account identifier.
    UpdateAccountRequest:
      type: object
      x-pennilogic-strict-provider: true
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        is_archived: {type: boolean}
