tags:
  - name: Auth
    description: ADR-019 passkey, device-bound session and recovery contracts; no password or SMS-login fallback.
  - name: Accounts
    description: Own financial accounts; balances are derived, never writable columns or client authority.
  - name: Transactions
    description: Own append-only balanced ledger facts; corrections reverse and re-post rather than editing entries.
  - name: Categories
    description: ADR-016 reporting dimension, not ledger accounts; assignments and redirect history are append-only.
  - name: CustomDestinations
    description: |
      Owner-only custom destination enrollment through the authenticated core API, never direct
      provider access. ADR-022 source contracts do not enable AI: global/custom flags remain OFF,
      provider/custom approvals and deployment inventory remain empty, and H1/H2 plus every
      applicable T1-T20 gate must pass before exposure. Operators cannot register or promote
      destinations through this group; administrative abuse controls use their separate authority.
paths:
  /auth/enrollments:
    post:
      operationId: startEnrollment
      tags: [Auth]
      security: [{DPoPBootstrap: []}]
      x-auth-mode: preauthentication-dpop
      x-idempotency: auth
      x-idempotency-reason: Email proof and enrollment ceremonies use single-use bounded challenges, not financial response replay.
      description: |
        Begin consent/age-eligible enrollment on a passkey-capable client with a fresh DPoP key
        proof, before an access token exists. Verify the eligibility receipt server-side, then
        send the single-use email verification instrument only when the owner-approved provider
        is available. Account existence, sends/limiting and timing are indistinguishable to callers.
        Nothing here creates an account, password, SMS login or active session.
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
        - $ref: '#/components/parameters/CoreApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthEnrollmentRequest'}
      responses:
        '202':
          description: Identical enrollment verification receipt; delivery is not account creation.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthEnrollmentAccepted'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/enrollments/{enrollmentId}/verify:
    parameters: [{$ref: '#/components/parameters/EnrollmentId'}]
    post:
      operationId: verifyEnrollmentChannel
      tags: [Auth]
      security: [{DPoPBootstrap: []}]
      x-auth-mode: preauthentication-dpop
      x-idempotency: auth
      x-idempotency-reason: A channel instrument is verified/consumed once under its ceremony and key, with its own lifetime.
      description: |
        Verify the six-digit code or link within 600 seconds and five attempts per send under the
        original enrollment/key. Never infer ownership from an email or client boolean. Issue a
        one-use passkey registration grant only after proof; an existing-account route is communicated
        through the verified inbox, never an anonymous lookup. No raw email body is accepted.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthChannelProofRequest'}}}
      responses:
        '200':
          description: Verified, key-bound one-time registration grant.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthEnrollmentVerified'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/passkeys/registration/options:
    post:
      operationId: registrationOptions
      tags: [Auth]
      security: [{DPoPBootstrap: []}]
      x-auth-mode: preauthentication-dpop
      x-idempotency: auth
      x-idempotency-reason: Registration options are single-use ceremony challenges, never thirty-day replayed credentials.
      description: |
        Consume only an enrollment/credential-add grant issued for the current verified key/intent.
        Return the accepted resident-key/UV-required, attestation-none options with all three
        algorithms, random handle and 32-byte challenge. The challenge expires in 300 seconds.
        RP/origin/domain inputs must be bound before real registration; no placeholder is accepted
        as production authorization. Existing credentials are excluded; the limit is ten.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthRegistrationOptionsRequest'}}}
      responses:
        '200':
          description: Single-use WebAuthn creation options.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthCreationOptions'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/passkeys/registration/result:
    post:
      operationId: registrationResult
      tags: [Auth]
      security: [{DPoPBootstrap: []}]
      x-auth-mode: preauthentication-dpop
      x-idempotency: auth
      x-idempotency-reason: Signature/challenge consumption and credential/session issuance have the ADR-019 ceremony lifecycle.
      description: |
        Verify type/origin/RP/challenge, credential key, UV, user handle, grant/DPoP ownership and
        account credential limit before atomic creation. For initial enrollment, create the profile
        with its required IANA zone only after channel proof plus passkey success; no password/OTP
        fallback. Verify key attestation when available without identifier extensions and discard
        the chain. An unattested device remains usable with the prescribed step-up restrictions.
        For credential-add, the established/recovering-device grant retains its one-shot and young-
        credential rules. Issue only minimal DPoP-bound tokens; no PII/token internals in diagnostics.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthRegistrationResultRequest'}}}
      responses:
        '201': {$ref: '#/components/responses/AuthTokens'}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/passkeys/authentication/options:
    post:
      operationId: authenticationOptions
      tags: [Auth]
      security: [{DPoPBootstrap: []}]
      x-auth-mode: preauthentication-dpop
      x-idempotency: auth
      x-idempotency-reason: Username-less options create a bounded single-use challenge and reveal no account lookup result.
      description: |
        Begin a discoverable, username-less passkey assertion bound to the proving device key.
        No email/password/SMS-login credential or account selector is accepted. Client-only
        authenticator_unavailable remains local-only and is not emitted as a server problem code.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthAuthenticationOptionsRequest'}}}
      responses:
        '200':
          description: Fresh UV-required assertion challenge.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthAssertionOptions'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/passkeys/authentication/result:
    post:
      operationId: authenticationResult
      tags: [Auth]
      security: [{DPoPBootstrap: []}]
      x-auth-mode: preauthentication-dpop
      x-idempotency: auth
      x-idempotency-reason: The assertion is consumed once; session issuance is not a financial idempotency receipt.
      description: |
        Verify the discoverable assertion, origin/RP/challenge/UV/signature/counter and DPoP key.
        Counter regression marks clone_suspected, requires another credential and notifies channels;
        it is not ignored for convenience. Register a device/family under the verified owner and
        notify existing channels/devices without persisting approximate network location.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthAssertionResultRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/AuthTokens'}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/token:
    post:
      operationId: refreshSession
      tags: [Auth]
      security: [{DPoPBootstrap: []}]
      x-auth-mode: preauthentication-dpop
      x-idempotency: auth
      x-idempotency-reason: Refresh rotates one bound family; its inclusive thirty-second grace is not a P30D financial replay.
      description: |
        Android refresh with grant_type=refresh_token and the same device key, including a server
        nonce in the newly signed DPoP proof. Serialize rotation per family. Within exactly 30.000
        seconds of recorded rotation, return the same newly minted pair; outside grace or after
        family revocation, revoke the family, notify and return session_revoked. Binding mismatch
        also revokes. Sliding lifetime is 30 days; absolute family lifetime 90 days requires a fresh
        passkey assertion. Authentication, nonce/signature and family checks occur before issuance.
        The first-party JSON transport is explicit; it does not claim a public OAuth authorization server.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthRefreshRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/AuthTokens'}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/token/browser:
    post:
      operationId: refreshBrowserSession
      tags: [Auth]
      security: [{DPoPBootstrap: [], BrowserRefreshCookie: []}]
      x-auth-mode: preauthentication-dpop
      x-idempotency: auth
      x-idempotency-reason: The HttpOnly refresh cookie uses the same rotation/grace/revocation semantics, never financial replay.
      description: |
        Web refresh under same-site/origin protections with the HttpOnly refresh cookie and fresh
        DPoP proof/nonce. Apply the same 30-second inclusive grace, 30-day sliding and 90-day absolute
        family bounds as Android. Never return a refresh token in web-script JSON or store access
        in persistent script-readable storage. Losing the non-extractable key ends the session.
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
        - $ref: '#/components/parameters/CoreApiVersion'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthBrowserRefreshRequest'}}}
      responses:
        '200':
          description: Access token only in JSON; rotate only the HttpOnly/Secure/SameSite=Strict refresh cookie.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}, DPoP-Nonce: {$ref: '#/components/headers/DPoPNonce'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthBrowserTokenSet'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/profile:
    get:
      operationId: getProfile
      tags: [Auth]
      description: Own private profile, including the canonical IANA calendar zone, under a live device-bound session.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      responses:
        '200':
          description: Own personal settings, never token/telemetry attributes.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthProfile'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
    put:
      operationId: updateProfile
      tags: [Auth]
      description: |
        Set own display name and tzdb-validated/canonicalized IANA zone. Re-derive calendar reports
        from stored immutable instants; never rewrite occurred_at/booked_at or infer a zone from an
        offset. No channel, owner, credential or entitlement field is accepted.
      x-idempotency-policy: {scope: [principal, method, path_template, key], lifetime: P30D, retryHorizon: P14D}
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthProfile'}}}
      responses:
        '200':
          description: Own updated metadata; ledger instants/history remain unchanged.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}, Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthProfile'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/credentials:
    get:
      operationId: listCredentials
      tags: [Auth]
      description: List the owner's at-most-ten passkeys; never return secret credential material or another owner's identifiers.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      responses:
        '200':
          description: Own passkey security metadata.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthCredentialList'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
    post:
      operationId: addCredential
      tags: [Auth]
      x-idempotency: auth
      x-idempotency-reason: A single-use mature-passkey grant authorizes one credential-add ceremony, not financial replay.
      description: |
        Obtain a bounded credential-add registration grant under fresh step-up bound to this
        operation/name/session/key. The separate addRecoveryCredential operation carries the
        ADR-019 one-shot recovering-device exception; this operation never accepts recovery
        proof instead of its required step-up. A new passkey retains its 24-hour maturity rule.
        Registration/result still verify the ceremony before a credential exists; notify all channels.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}, {$ref: '#/components/parameters/StepUpToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthCredentialNameRequest'}}}
      responses:
        '201':
          description: One-use registration grant, not a created passkey.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthRegistrationGrant'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/credentials/{credentialId}:
    parameters: [{$ref: '#/components/parameters/CredentialId'}]
    patch:
      operationId: renameCredential
      tags: [Auth]
      x-idempotency: auth
      x-idempotency-reason: Exact-target single-use credential-management grant; no replay of secret responses.
      description: Rename only the owner's exact credential with fresh mature-passkey UV step-up and operation/target/body binding.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}, {$ref: '#/components/parameters/StepUpToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AuthCredentialNameRequest'}}}
      responses:
        '200':
          description: Updated own passkey name; channels/devices are notified.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthCredential'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
    delete:
      operationId: removeCredential
      tags: [Auth]
      x-idempotency: auth
      x-idempotency-reason: Exact credential revocation uses its single-use authorization/lifecycle, not a financial receipt.
      description: |
        Remove only the exact own credential under fresh bound mature-passkey step-up. Verify
        target/session/key and single use before execution; a token for another credential is
        invalid. Notify channels/devices and use the platform Signal API when supported.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}, {$ref: '#/components/parameters/StepUpToken'}]
      responses:
        '204': {$ref: '#/components/responses/AuthNoContent'}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
        default: {$ref: '#/components/responses/CoreProblem'}
  /auth/sessions:
    get:
      operationId: listSessions
      tags: [Auth]
      description: Owner-only active sessions; no token/family hash or other-owner visibility.
      parameters: [{$ref: '#/components/parameters/DPoPProof'}, {$ref: '#/components/parameters/CoreApiVersion'}]
      responses:
        '200':
          description: Bounded own session metadata.
          headers: {Cache-Control: {$ref: '#/components/headers/CoreNoStore'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthSessionList'}}}
        '401': {$ref: '#/components/responses/CoreDPoPChallenge'}
