[mypy]
# Strict type-check of the Python smoke consumer, the hand-written seams and the generated models.
python_version = 3.14
strict = true
show_error_codes = true
pretty = false
mypy_path = $MYPY_CONFIG_FILE_DIR/../../build/generated/python:$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/tests
namespace_packages = true
explicit_package_bases = true

# Generated transport modules come from openapi-generator's own python templates, which are typed to
# the generator's baseline (check_untyped_defs and friends) rather than --strict. Only these modules
# are relaxed; every model and every hand-written seam stays strict.
[mypy-pennilogic_contracts.api_client,pennilogic_contracts.rest,pennilogic_contracts.exceptions,pennilogic_contracts.api_response]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
no_implicit_reexport = false
warn_return_any = false

# The package and models __init__ modules are re-export hubs by design (generated without __all__).
[mypy-pennilogic_contracts,pennilogic_contracts.models]
implicit_reexport = true

[mypy-pennilogic_contracts.configuration]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = typeddict-item
